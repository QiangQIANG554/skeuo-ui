<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e6e0"/>
    </linearGradient>
  </defs>
  <!-- 凸起圆盘 -->
  <rect x="4" y="4" width="88" height="88" rx="28" fill="#f7f6f2"/>
  <rect x="4" y="4" width="88" height="88" rx="28" fill="url(#lg)"/>
  <!-- 内凹圆 -->
  <circle cx="48" cy="48" r="30" fill="#f7f6f2"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#d9d7d1" stroke-width="2" opacity="0.6"/>
  <!-- S 字母 -->
  <text x="48" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#5f86a8">S</text>
</svg>
